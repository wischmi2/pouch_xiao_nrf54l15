# XIAO BLE (nRF52840) UF2 layout has no MCUboot slot0_partition.
# OTA is disabled; drop image manager deps that require slot0.
CONFIG_STREAM_FLASH=n
CONFIG_IMG_MANAGER=n
CONFIG_IMG_ERASE_PROGRESSIVELY=n

# USB CDC console needs time to enumerate before mcumgr/smpmgr (see xiao_ble board doc).
CONFIG_BOOT_DELAY=3000

# Battery-only deploy (Seeed Scenario B).
#
# The default prj.conf keeps USB UART + shell + mcumgr for bench debug (Scenario A).
# With UART enabled, the XIAO nRF54L15 often fails to boot when powered only from LiPo
# (reset with USB unplugged → no BLE, no Golioth, board looks dead).
#
# Build:
#   west build -b xiao_nrf54l15/nrf54l15/cpuapp --pristine --no-sysbuild -- \
#     -DEXTRA_CONF_FILE=prj_battery.conf
#
# Provision credentials over USB first (default prj.conf build + smpmgr), then flash
# the prj_battery.conf image for field / LiPo-only operation.

CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n
CONFIG_CONSOLE=n
CONFIG_SHELL=n
CONFIG_UART_CONSOLE_MCUMGR=n
CONFIG_MCUMGR_TRANSPORT_SHELL=n
CONFIG_FILE_SYSTEM_SHELL=n
CONFIG_MCUMGR=n

# Visible power/boot indicator when serial is disabled (see main.c).
CONFIG_EXAMPLE_BATTERY_POWER_LED=y

# Stronger BLE advertising when on battery power (helps gateway discovery).
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
